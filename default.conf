limit_req_zone $binary_remote_addr zone=by_ip:10m rate=10r/s;

upstream django_app {
    server web:8000;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;

    # Глобальний ліміт для всього сайту
    limit_req zone=by_ip burst=5 nodelay;

    # Роздача статики силами Nginx
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        
        # ФІКС: Вимикаємо ліміт запитів конкретно для статичних файлів,
        # щоб CSS/JS/зображення завантажувалися без обмежень
        limit_req off;
    }

    # Проксі на Gunicorn
    location / {
        proxy_pass http://django_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}
